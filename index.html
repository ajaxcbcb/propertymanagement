        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR' }).format(amount);
        };

        const calculateLateFee = (rentAmount, outstandingAmount) => {
            if (!outstandingAmount || outstandingAmount <= 0) return 0;
            // 2% per month on outstanding amount
            return outstandingAmount * 0.02; 
        };

        const getStatusColor = (status) => {
            const map = {
                'Good Standing': 'bg-green-100 text-green-700',
                'Full': 'bg-blue-100 text-blue-700',
                'Maintenance': 'bg-orange-100 text-orange-700',
                'Marketing': 'bg-purple-100 text-purple-700',
                'High': 'bg-red-100 text-red-700',
                'Medium': 'bg-yellow-100 text-yellow-700',
                'Low': 'bg-blue-100 text-blue-700',
                'Paid': 'bg-green-100 text-green-700',
                'Late': 'bg-red-100 text-red-700',
                'Active': 'bg-emerald-100 text-emerald-700',
                'Pending': 'bg-slate-100 text-slate-700',
                'Notice Given': 'bg-yellow-100 text-yellow-700',
                'Valid': 'bg-emerald-100 text-emerald-700',
                'Expiring Soon': 'bg-orange-100 text-orange-700'
            };
            return map[status] || 'bg-gray-100 text-gray-700';
        };

        // --- RENDERING LOGIC ---

            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear

            } else {

        function renderLogin(container) {

                    renderApp();

                    <span class="${state.isSidebarOpen ? '' : 'hidden'} font-medium whitespace-nowrap">${label}</span>
                </button>
            `;
        }

        function renderCurrentView() {
            switch(state.activeTab) {
                case 'dashboard': return renderDashboard();
                case 'properties': return renderProperties();
                case 'tenants': return renderTenants();
                case 'financials': return renderAnalytics();
                case 'master': return renderMasterData();

                                <h3 class="font-bold text-lg text-slate-800">Recent Maintenance Requests</h3>

                            <div class="space-y-4">

                                    <div class="flex justify-between text-sm mb-2"><span class="text-slate-600 font-medium">Rent Collected</span><span class="text-slate-900 font-bold">84%</span></div>

                                        <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg"><i data-lucide="more-vertical" class="w-5 h-5"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTenants() {
            const totalOS = IMPORTED_TENANTS.reduce((sum, t) => sum + t.outstanding, 0);
            const countOS = IMPORTED_TENANTS.filter(t => t.outstanding > 0).length;

            return `
                <div class="space-y-6">
                    <!-- Tenant Stats -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-red-100 shadow-sm flex items-center justify-between">
                            <div><p class="text-sm font-medium text-slate-500 mb-1">Total Outstanding (OS)</p><h3 class="text-2xl font-bold text-red-600">${formatCurrency(totalOS)}</h3></div>
                            <div class="p-3 bg-red-50 text-red-600 rounded-lg"><i data-lucide="alert-circle" class="w-6 h-6"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between">
                            <div><p class="text-sm font-medium text-slate-500 mb-1">Tenants in Arrears</p><h3 class="text-2xl font-bold text-slate-800">${countOS}</h3></div>
                            <div class="p-3 bg-orange-50 text-orange-600 rounded-lg"><i data-lucide="users" class="w-6 h-6"></i></div>
                        </div>
                    </div>

                    <!-- Tenant Table -->
                    <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-100"><h2 class="text-lg font-bold text-slate-800">Tenant Directory & Status</h2></div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-slate-600">
                                <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                                    <tr>
                                        <th class="px-6 py-4">Tenant Name</th>
                                        <th class="px-6 py-4">Property</th>
                                        <th class="px-6 py-4">Rent</th>
                                        <th class="px-6 py-4">Status</th>
                                        <th class="px-6 py-4">Outstanding & Fee (2%)</th>
                                        <th class="px-6 py-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${IMPORTED_TENANTS.map(t => {
                                        const fee = calculateLateFee(t.rentAmount, t.outstanding);
                                        const months = t.outstanding > 0 ? (t.outstanding/t.rentAmount).toFixed(1) : 0;
                                        return `
                                            <tr class="hover:bg-slate-50/50">
                                                <td class="px-6 py-4"><span class="font-medium text-slate-900">${t.name}</span></td>
                                                <td class="px-6 py-4"><p class="text-slate-900 font-medium truncate w-48">${t.property}</p><p class="text-xs text-slate-500">${t.unit}</p></td>
                                                <td class="px-6 py-4 font-medium">${formatCurrency(t.rentAmount)}</td>
                                                <td class="px-6 py-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusColor(t.rentStatus)}">${t.rentStatus}</span></td>
                                                <td class="px-6 py-4">
                                                    ${t.outstanding > 0 ? `
                                                        <div class="flex flex-col gap-1">
                                                            <span class="text-red-600 font-bold bg-red-50 px-2 py-1 rounded text-xs w-fit">OS: ${formatCurrency(t.outstanding)}</span>
                                                            <span class="text-[11px] text-purple-600 font-medium px-1">+ Fee: ${formatCurrency(fee)}</span>
                                                            <span class="text-[10px] text-slate-500">(${months} mo late)</span>
                                                        </div>
                                                    ` : '<span class="text-slate-400">-</span>'}
                                                </td>
                                                <td class="px-6 py-4 text-right">
                                                    <div class="flex justify-end gap-2">
                                                        <button class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"><i data-lucide="mail" class="w-4 h-4"></i></button>
                                                        <button class="p-1.5 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded"><i data-lucide="phone" class="w-4 h-4"></i></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAnalytics() {
            const totalRent = IMPORTED_TENANTS.reduce((acc, t) => acc + t.rentAmount, 0);
            const totalOutstanding = IMPORTED_TENANTS.reduce((sum, t) => sum + t.outstanding, 0);
            const actualCollected = totalRent - totalOutstanding;
            const collectionRate = (actualCollected / totalRent) * 100;
            const totalPotentialLateFees = IMPORTED_TENANTS.reduce((acc, t) => acc + calculateLateFee(t.rentAmount, t.outstanding), 0);
            const debtors = IMPORTED_TENANTS.filter(t => t.outstanding > 0).sort((a, b) => b.outstanding - a.outstanding);

            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-800">Financial Analytics</h2>
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-sm font-medium rounded-lg border border-blue-100">FY 2024-2025</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${renderStatCard('Revenue Potential', formatCurrency(totalRent), 'Monthly', true, 'trending-up', 'text-blue-600', 'bg-blue-100')}
                        ${renderStatCard('Actual Collection', formatCurrency(actualCollected), `${collectionRate.toFixed(1)}% Rate`, collectionRate > 90, 'wallet', 'text-emerald-600', 'bg-emerald-100')}
                        ${renderStatCard('Arrears', formatCurrency(totalOutstanding), 'Critical', false, 'alert-circle', 'text-red-600', 'bg-red-100')}
                        ${renderStatCard('Proj. Late Fees (2%)', formatCurrency(totalPotentialLateFees), 'Added Rev', true, 'dollar-sign', 'text-purple-600', 'bg-purple-100')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm">
                            <h3 class="font-bold text-lg text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-slate-400"></i> Collection Status</h3>
                            <div class="space-y-4">
                                <div class="space-y-2">
                                    <div class="flex justify-between text-sm"><span class="text-slate-600">Collected</span><span class="font-bold text-slate-800">${formatCurrency(actualCollected)}</span></div>
                                    <div class="h-4 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 rounded-full" style="width: ${Math.max(5, collectionRate)}%"></div></div>
                                </div>
                                <div class="space-y-2">
                                    <div class="flex justify-between text-sm"><span class="text-slate-600">Outstanding</span><span class="font-bold text-red-600">${formatCurrency(totalOutstanding)}</span></div>
                                    <div class="h-4 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-red-500 rounded-full" style="width: ${Math.min(100, (totalOutstanding / totalRent) * 100)}%"></div></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm">
                            <h3 class="font-bold text-lg text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-slate-400"></i> Top Debtors</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left">
                                    <thead class="bg-slate-50 text-slate-500 font-semibold"><tr><th class="p-3">Tenant</th><th class="p-3">OS</th><th class="p-3">Fee</th></tr></thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${debtors.length > 0 ? debtors.map(t => `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-800">${t.name}</td>
                                                <td class="p-3 font-bold text-red-600">${formatCurrency(t.outstanding)}</td>
                                                <td class="p-3 text-purple-600">+${formatCurrency(calculateLateFee(t.rentAmount, t.outstanding))}</td>
                                            </tr>
                                        `).join('') : '<tr><td colspan="3" class="p-4 text-center text-slate-400">No arrears</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMasterData() {
            const tabs = [
                {id: 'properties', label: 'Asset Register', icon: 'building-2'},
                {id: 'tenants', label: 'Tenant Master', icon: 'users'},
                {id: 'leases', label: 'Lease Contracts', icon: 'file-text'},
                {id: 'vendors', label: 'Vendor Mgmt', icon: 'briefcase'},
                {id: 'finance', label: 'Financial Config', icon: 'credit-card'}
            ];

            return `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2"><i data-lucide="database" class="text-blue-600 w-6 h-6"></i> Master Data Hub</h2>
                    
                    <!-- Sub Nav -->
                    <div class="flex overflow-x-auto pb-2 gap-2 border-b border-slate-200">
                        ${tabs.map(tab => `
                            <button onclick="setMasterTab('${tab.id}')" class="flex items-center gap-2 px-4 py-2 rounded-t-lg transition-colors whitespace-nowrap text-sm font-medium border-b-2 ${state.masterSubTab === tab.id ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50'}">
                                <i data-lucide="${tab.icon}" class="w-4 h-4"></i> ${tab.label}
                            </button>
                        `).join('')}
                    </div>

                    <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden min-h-[400px]">
                        ${renderMasterSubContent()}
                    </div>
                </div>
            `;
        }

        function renderMasterSubContent() {
            switch(state.masterSubTab) {
                case 'properties':
                    return renderTable(
                        ['Code', 'Site/Project', 'Type', 'GFA', 'Status'],
                        IMPORTED_PROPERTIES.map(p => `
                            <td class="p-4 pl-6 font-mono text-xs text-slate-500">${p.code}</td>
                            <td class="p-4 font-medium text-slate-800">${p.name}</td>
                            <td class="p-4 text-slate-600">${p.type}</td>
                            <td class="p-4 text-slate-600">${p.gfa}</td>
                            <td class="p-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">${p.status}</span></td>
                        `)
                    );
                case 'tenants':
                    return renderTable(
                        ['Company', 'Reg No (SSM)', 'Tax ID', 'Contact', 'Email'],
                        IMPORTED_TENANTS.map(t => `
                            <td class="p-4 pl-6 font-medium text-slate-800">${t.name}</td>
                            <td class="p-4 font-mono text-xs text-slate-500">${t.ssm}</td>
                            <td class="p-4 font-mono text-xs text-slate-500">${t.taxId}</td>
                            <td class="p-4 text-slate-600">${t.contact}</td>
                            <td class="p-4 text-blue-600 text-sm">${t.email}</td>
                        `)
                    );
                case 'leases':
                    return renderTable(
                        ['ID', 'Tenant', 'Unit', 'Term', 'Rent', 'Escalation'],
                        MOCK_LEASES.map(l => `
                            <td class="p-4 pl-6 font-mono text-xs text-blue-600">${l.id}</td>
                            <td class="p-4 font-medium text-slate-800">${l.tenant}</td>
                            <td class="p-4 text-slate-600">${l.unit}</td>
                            <td class="p-4 text-slate-600 text-sm">${l.term}<br><span class="text-xs text-slate-400">${l.start}</span></td>
                            <td class="p-4 font-medium">${formatCurrency(l.baseRent)}</td>
                            <td class="p-4 text-xs bg-slate-50 rounded text-slate-600 px-2 py-1 w-fit">${l.escalation}</td>
                        `)
                    );
                case 'vendors':
                    return renderTable(
                        ['Vendor', 'Category', 'Contact', 'Ins. Exp', 'Compliance'],
                        MOCK_VENDORS.map(v => `
                            <td class="p-4 pl-6 font-medium text-slate-800">${v.name}</td>
                            <td class="p-4"><span class="px-2 py-1 bg-slate-100 rounded text-xs text-slate-600">${v.category}</span></td>
                            <td class="p-4 text-slate-600 text-sm">${v.contact}<br><span class="text-xs text-slate-400">${v.phone}</span></td>
                            <td class="p-4 text-slate-600">${v.insuranceExp}</td>
                            <td class="p-4"><span class="px-2 py-1 rounded text-xs font-medium ${getStatusColor(v.compliance)}">${v.compliance}</span></td>
                        `)
                    );
                case 'finance':
                    return renderTable(
                        ['GL Code', 'Description', 'Type', 'Tax'],
                        MOCK_FINANCE_CODES.map(c => `
                            <td class="p-4 pl-6 font-mono text-xs text-blue-600">${c.code}</td>
                            <td class="p-4 font-medium text-slate-800">${c.description}</td>
                            <td class="p-4"><span class="px-2 py-1 rounded text-xs ${c.type === 'Revenue' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}">${c.type}</span></td>
                            <td class="p-4 text-slate-600">${c.tax}</td>
                        `)
                    );
                default: return '';
            }
        }

        // --- COMPONENT HELPERS ---
        function renderStatCard(label, value, change, isPositive, icon, color, bg) {
            return `
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div><p class="text-sm font-medium text-slate-500 mb-1">${label}</p><h3 class="text-2xl font-bold text-slate-800">${value}</h3></div>
                        <div class="p-3 rounded-lg ${bg}"><i data-lucide="${icon}" class="w-5 h-5 ${color}"></i></div>
                    </div>
                    <div class="mt-4 flex items-center gap-2">
                        <span class="flex items-center text-xs font-semibold ${isPositive ? 'text-green-600' : 'text-red-600'}">
                            <i data-lucide="${isPositive ? 'arrow-up-right' : 'arrow-down-right'}" class="w-3 h-3 mr-1"></i> ${change}
                        </span>
                        <span class="text-xs text-slate-400">vs last month</span>
                    </div>
                </div>
            `;
        }

        function renderTable(headers, rows) {
            return `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-100">
                            <tr>${headers.map(h => `<th class="p-4 ${h === headers[0] ? 'pl-6' : ''}">${h}</th>`).join('')}</tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">${rows.map(r => `<tr class="hover:bg-slate-50">${r}</tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        // --- INTERACTION HANDLERS ---
        
        window.setActiveTab = (tab) => {
            state.activeTab = tab;
            renderApp();
        };

        window.setMasterTab = (tab) => {
            state.masterSubTab = tab;
            renderApp();
        };

        window.toggleSidebar = () => {
            state.isSidebarOpen = !state.isSidebarOpen;
            renderApp();
        };

        window.handleLogout = () => {
            state.isAuthenticated = false;
            state.activeTab = 'dashboard';
            renderApp();
        };

        window.exportPDF = () => {
            const element = document.getElementById('content-area');
            const opt = {
                margin: 10,
                filename: `dashboard-export-${new Date().toISOString().slice(0,10)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        };

        // --- INITIALIZATION ---
        renderApp();

    </script>
</body>
</html>
